<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Keyboard Display</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      padding: 12px;
    }
    .display-wrap {
      flex: 0 0 auto;
      background: #000;
      border: 3px solid #444;
      border-radius: 12px;
      padding: 8px 16px;
      margin-bottom: 10px;
      min-height: 50px;
      max-height: 16vh;
      overflow-y: auto;
      display: flex;
      align-items: center;
    }
    .display {
      font-size: 6vh;
      font-weight: bold;
      color: #00ff88;
      line-height: 1;
      letter-spacing: 0.05em;
      word-break: break-all;
      width: 100%;
      font-family: "Courier New", monospace;
    }
    .display::after {
      content: "▌";
      animation: blink 1s infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    .keys {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      min-height: 0;
    }
    .row {
      display: contents;
    }
    .key {
      background: #2d2d2d;
      color: #fff;
      border: 2px solid #444;
      border-radius: 10px;
      cursor: pointer;
      font-size: 4.5vh;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s, background 0.08s;
      touch-action: manipulation;
      min-height: 0;
    }
    .key:active {
      transform: scale(0.93);
      background: #00aa66;
    }
    .key.num {
      background: #3a3a3a;
      color: #ffdd66;
    }
    .key.action {
      background: #5a2d2d;
      color: #ff8888;
      font-size: 3vh;
    }
    .key.space {
      background: #2d4d5a;
      color: #88ccff;
    }
    .key.wide {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="display-wrap">
      <div class="display" id="display"></div>
    </div>
    <div class="keys" id="keys"></div>
  </div>

  <script>
    const LAYOUT = [
      ['1','2','3','4','5','6','7','8','9','0'],
      ['Q','W','E','R','T','Y','U','I','O','P'],
      ['A','S','D','F','G','H','J','K','L',{label:'⌫',action:'back',cls:'action'}],
      ['Z','X','C','V','B','N','M',{label:'⎵',action:'space',cls:'space wide'}],
      [{label:'CLEAR',action:'clear',cls:'action wide'},{label:'🔊',action:'speak',cls:'action wide'}]
    ];

    const keys = document.getElementById('keys');
    let text = '';

    function render() {
      const display = document.getElementById('display');
      display.textContent = text || '';
    }

    function press(ch) {
      text += ch;
      render();
    }

    function backspace() {
      text = text.slice(0, -1);
      render();
    }

    function space() {
      text += ' ';
      render();
    }

    function clearAll() {
      text = '';
      render();
    }

    function speak() {
      if (!text) return;
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ms-MY';
        u.rate = 0.85;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      }
    }

    LAYOUT.forEach(row => {
      row.forEach(item => {
        const btn = document.createElement('div');
        btn.className = 'key';
        if (typeof item === 'string') {
          btn.textContent = item;
          if (/^[0-9]$/.test(item)) btn.classList.add('num');
          btn.onclick = () => press(item);
        } else {
          btn.textContent = item.label;
          btn.classList.add(...(item.cls ? item.cls.split(' ') : []));
          if (item.action === 'back') btn.onclick = backspace;
          else if (item.action === 'space') btn.onclick = space;
          else if (item.action === 'clear') btn.onclick = clearAll;
          else if (item.action === 'speak') btn.onclick = speak;
        }
        keys.appendChild(btn);
      });
    });

    render();
  </script>
</body>
</html>
